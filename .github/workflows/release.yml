name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example: 1.0.16)'
        required: true
        default: '1.0.16'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      PROJECT_PATH: Steam Desktop Authenticator/Steam Desktop Authenticator.csproj
    steps:
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '\A(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z') {
            throw 'Enter a release version in major.minor.patch format, for example 1.0.16.'
          }
          "RELEASE_TAG=v$env:RELEASE_VERSION" >> $env:GITHUB_ENV
          "RELEASE_TITLE=Version $env:RELEASE_VERSION" >> $env:GITHUB_ENV
          "ARCHIVE_NAME=SteamDesktopAuthenticator-$env:RELEASE_VERSION-win-x64.zip" >> $env:GITHUB_ENV

      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish framework-dependent Windows x64 application
        run: |
          dotnet publish "$env:PROJECT_PATH" --configuration Release --runtime win-x64 --self-contained false --output artifacts/publish -p:PublishSingleFile=false -p:PublishTrimmed=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package application
        run: |
          Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/$env:ARCHIVE_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}-win-x64
          path: artifacts/${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

      - name: Create release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --target "$env:GITHUB_SHA" --title "$env:RELEASE_TITLE" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release edit "$env:RELEASE_TAG" --title "$env:RELEASE_TITLE"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload "$env:RELEASE_TAG" "artifacts/$env:ARCHIVE_NAME" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
