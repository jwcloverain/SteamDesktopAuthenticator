name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      PROJECT_PATH: Steam Desktop Authenticator/Steam Desktop Authenticator.csproj
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read and validate version
        id: version
        run: |
          [xml]$project = Get-Content -LiteralPath $env:PROJECT_PATH -Raw
          $version = [string]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid project version: $version"
          }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "archive=SteamDesktopAuthenticator-$version-win-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Publish framework-dependent Windows x64 application
        run: |
          dotnet publish "$env:PROJECT_PATH" --configuration Release --runtime win-x64 --self-contained false --output artifacts/publish -p:PublishSingleFile=false -p:PublishTrimmed=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package application
        env:
          ARCHIVE_NAME: ${{ steps.version.outputs.archive }}
        run: |
          Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/$env:ARCHIVE_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.tag }}-win-x64
          path: artifacts/${{ steps.version.outputs.archive }}
          if-no-files-found: error

      - name: Create release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE_NAME: ${{ steps.version.outputs.archive }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --target "$env:GITHUB_SHA" --title "$env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload "$env:RELEASE_TAG" "artifacts/$env:ARCHIVE_NAME" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
